<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · MediCare+</title><link rel="stylesheet" href="css/style.css"><script src="js/auth.js" defer></script></head>
<body class="auth"><main class="card"><h1>MediCare+</h1><p>Log in to manage patients and appointments.</p>
<form id="authForm" data-mode="login" novalidate>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username"></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"></div>
<div class="err" id="err" role="alert"></div><button class="btn">Log in</button></form>
<p style="margin-top:16px">New staff member? <a href="register.html">Create an account</a> · <a href="index.html">Home</a></p></main></body></html>
