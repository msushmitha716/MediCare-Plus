<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · MediCare+</title><link rel="stylesheet" href="css/style.css"><script src="js/auth.js" defer></script></head>
<body class="auth"><main class="card"><h1>Create account</h1><p>Register as hospital staff.</p>
<form id="authForm" data-mode="register" novalidate>
<div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name"></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username"></div>
<div class="field"><label for="role">Role</label><select id="role" name="role"><option value="">Select…</option><option>Administrator</option><option>Doctor</option><option>Receptionist</option></select></div>
<div class="field"><label for="password">Password (8+ characters)</label><input id="password" name="password" type="password" autocomplete="new-password"></div>
<div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password"></div>
<div class="err" id="err" role="alert"></div><button class="btn">Create account</button></form>
<p style="margin-top:16px">Already registered? <a href="login.html">Log in</a></p></main></body></html>
